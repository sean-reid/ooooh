name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  packages:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: sudo xcode-select -s /Applications/Xcode_26.4.app
      - uses: actions/cache@v4
        with:
          path: Packages/.build
          key: spm-build-${{ runner.os }}-${{ hashFiles('Packages/Package.swift', 'Packages/Package.resolved') }}
          restore-keys: spm-build-${{ runner.os }}-
      - run: swift format lint --strict --recursive Packages App
      - run: swift build --package-path Packages
      - run: swift test --package-path Packages
      - run: swift run --package-path Packages eval --corpus fixtures/synthetic/estimate --require-perfect

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run types
      - run: npm run typecheck
      - run: npm test
      - run: node --test ../site/site.test.mjs ../tools/synth/*.test.mjs ../tools/labeler/*.test.mjs
      - run: npm run coverage
      - name: coverage totals
        run: >
          jq -r '.total | "lines \(.lines.pct)% (\(.lines.covered)/\(.lines.total)), branches \(.branches.pct)% (\(.branches.covered)/\(.branches.total))"'
          dist/coverage/coverage-summary.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: worker-coverage
          path: worker/dist/coverage/coverage-summary.json
          retention-days: 30
      - run: npm run deploy:dry
      - run: npm audit --audit-level=high

  app:
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: sudo xcode-select -s /Applications/Xcode_26.4.app
      - uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('Packages/Package.swift', 'Packages/Package.resolved', 'project.yml') }}
          restore-keys: spm-xcode-${{ runner.os }}-
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >
          xcodebuild -project ooooh.xcodeproj -scheme ooooh
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          -derivedDataPath DerivedData -resultBundlePath ui.xcresult
          -only-testing:oooohUITests test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-results
          path: ui.xcresult
          retention-days: 7

  snapshots:
    if: github.event_name == 'pull_request'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - run: sudo xcode-select -s /Applications/Xcode_26.4.app
      - uses: actions/cache@v4
        with:
          path: DerivedData/SourcePackages
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('Packages/Package.swift', 'Packages/Package.resolved', 'project.yml') }}
          restore-keys: spm-xcode-${{ runner.os }}-
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >
          xcodebuild -project ooooh.xcodeproj -scheme ooooh
          -destination 'platform=iOS Simulator,name=iPhone 17 Pro'
          -derivedDataPath DerivedData -resultBundlePath design.xcresult
          -only-testing:oooohTests -only-testing:DesignTests -only-testing:NotesSnapshotTests -only-testing:AudioTests test
        env:
          SIMCTL_CHILD_SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/snapshot-failures
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: snapshot-results
          path: design.xcresult
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: snapshot-failures
          path: snapshot-failures
          if-no-files-found: ignore
          retention-days: 7
