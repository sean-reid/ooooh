name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The release PR touches only the changelog, the manifest, and the version marker in
  # project.yml, so the simulator jobs skip it; anything else runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: classify
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          code=false
          for file in $(git diff --name-only "$BASE...HEAD"); do
            case "$file" in
              CHANGELOG.md|.release-please-manifest.json) ;;
              project.yml)
                lines=$(git diff "$BASE...HEAD" -- project.yml | grep -E '^[-+][^-+]' || true)
                [ "$(printf '%s\n' "$lines" | grep -c 'x-release-please-version')" = "$(printf '%s\n' "$lines" | grep -c .)" ] || code=true
                ;;
              *) code=true ;;
            esac
          done
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "code=$code"
  packages:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s /Applications/Xcode_26.4.app
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Packages/.build
          key: spm-build-${{ runner.os }}-${{ hashFiles('Packages/Package.swift', 'Packages/Package.resolved') }}
          restore-keys: spm-build-${{ runner.os }}-
      - run: swift format lint --strict --recursive Packages App
      - run: swift build --package-path Packages
      - run: swift test --package-path Packages
      # SwiftData resolves key paths differently under the Release optimiser; the store's queries run there too.
      - run: swift test --package-path Packages -c release --filter PersistenceTests
      - run: swift run --package-path Packages eval --corpus fixtures/synthetic/estimate --require-perfect
      - run: >
          swift run --package-path Packages eval --corpus fixtures/synthetic/estimate
          --answers-dir fixtures/synthetic/estimate/answers
          --gate precision=0.28,recall=0.45,finished-recall=0.55,intrusions=3,collisions=14

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run types
      - run: npm run typecheck
      - run: npm test
      - run: >
          node --test ../site/*.test.mjs ../tools/store/*.test.mjs ../tools/synth/*.test.mjs
          ../tools/labeler/*.test.mjs ../tools/judge/*.test.mjs ../tools/label/*.test.mjs
          ../tools/policy/*.test.mjs
      - run: npm run coverage
      - name: coverage totals
        run: >
          jq -r '.total | "lines \(.lines.pct)% (\(.lines.covered)/\(.lines.total)), branches \(.branches.pct)% (\(.branches.covered)/\(.branches.total))"'
          dist/coverage/coverage-summary.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: worker-coverage
          path: worker/dist/coverage/coverage-summary.json
          retention-days: 30
      - run: npm run deploy:dry
      - run: npm audit --audit-level=moderate

  app:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.code == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s /Applications/Xcode_26.4.app
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData/SourcePackages
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('Packages/Package.swift', 'Packages/Package.resolved', 'project.yml') }}
          restore-keys: spm-xcode-${{ runner.os }}-
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: simulator
        # A freshly selected Xcode has no simulator service running yet; first launch starts it.
        # The device boots ahead of both builds so its first-boot work is over before the first UI test launches the app.
        run: |
          sudo xcodebuild -runFirstLaunch
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name == "iPhone 17 Pro")][0].udid')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      - name: release build
        # The archive Sean uploads is this configuration; the two values below shipped wrong once each.
        run: |
          xcodebuild -project ooooh.xcodeproj -scheme ooooh -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO build
          plist=DerivedData/Build/Products/Release-iphonesimulator/ooooh.app/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :OoooohWorkerURL' "$plist")" = "https://api.ooooh.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :UIDeviceFamily' "$plist" | tr -d '[:space:]')" = "Array{1}"
      - run: >
          xcodebuild -project ooooh.xcodeproj -scheme ooooh
          -destination "id=$SIMULATOR_UDID"
          -derivedDataPath DerivedData -resultBundlePath ui.xcresult
          -only-testing:oooohUITests -retry-tests-on-failure -test-iterations 2 test
      - name: retries
        if: always()
        run: bin/test-retries ui.xcresult | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ui-results
          path: ui.xcresult
          retention-days: 7

  snapshots:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.code == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s /Applications/Xcode_26.4.app
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData/SourcePackages
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('Packages/Package.swift', 'Packages/Package.resolved', 'project.yml') }}
          restore-keys: spm-xcode-${{ runner.os }}-
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: simulator
        # A freshly selected Xcode has no simulator service running yet; first launch starts it.
        # The test host restarts under a headless boot; Simulator.app gives the device a window.
        run: |
          sudo xcodebuild -runFirstLaunch
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name == "iPhone 17 Pro")][0].udid')
          xcrun simctl boot "$udid"
          open -a Simulator --args -CurrentDeviceUDID "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      - run: >
          xcodebuild -project ooooh.xcodeproj -scheme ooooh
          -destination "id=$SIMULATOR_UDID"
          -derivedDataPath DerivedData -resultBundlePath design.xcresult
          -only-testing:oooohTests -only-testing:DesignTests -only-testing:NotesSnapshotTests
          -only-testing:BillingTests -only-testing:SettingsSnapshotTests
          -skip-testing:BillingTests/BillingStoreTests -skip-testing:BillingTests/PurchaseTokenTests test
        env:
          SIMCTL_CHILD_SNAPSHOT_ARTIFACTS: ${{ github.workspace }}/snapshot-failures
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: snapshot-results
          path: design.xcresult
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: snapshot-failures
          path: snapshot-failures
          if-no-files-found: ignore
          retention-days: 7

  # PromptSpeaker measures real playback latency; it runs alone so nothing else loads the simulator.
  audio:
    needs: changes
    if: github.event_name != 'push' && needs.changes.outputs.code == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: sudo xcode-select -s /Applications/Xcode_26.4.app
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: DerivedData/SourcePackages
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('Packages/Package.swift', 'Packages/Package.resolved', 'project.yml') }}
          restore-keys: spm-xcode-${{ runner.os }}-
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: simulator
        # A freshly selected Xcode has no simulator service running yet; first launch starts it.
        run: |
          sudo xcodebuild -runFirstLaunch
          udid=$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name == "iPhone 17 Pro")][0].udid')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
      - name: audio device
        # The simulator plays through the host's coreaudiod, whose first open of the output device is the slow one; afplay takes it before the test host does.
        # The image's Null Audio Device is sometimes missing after boot; restarting coreaudiod brings it up.
        run: |
          system_profiler SPAudioDataType
          if ! afplay /System/Library/Sounds/Tink.aiff; then
            sudo launchctl kickstart -kp system/com.apple.audio.coreaudiod
            sleep 5
            system_profiler SPAudioDataType
            afplay /System/Library/Sounds/Tink.aiff
          fi
      - run: >
          xcodebuild -project ooooh.xcodeproj -scheme ooooh
          -destination "id=$SIMULATOR_UDID"
          -derivedDataPath DerivedData -resultBundlePath audio.xcresult
          -only-testing:AudioTests test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: audio-results
          path: audio.xcresult
          retention-days: 7

