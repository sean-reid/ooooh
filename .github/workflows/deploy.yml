name: deploy

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.ooooh.app
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: require the deploy credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set in Actions secrets"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --env production
      - name: smoke
        run: |
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 https://api.ooooh.app/health | grep -q '"ok":true'
          curl -fsS https://api.ooooh.app/v1/config | jq .version
