name: deploy

on:
  push:
    branches: [main]
    paths:
      - "worker/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://api.ooooh.app
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: require the deploy credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set in Actions secrets"
            exit 1
          fi
      - run: npm ci
      - run: npm run lint && npm run format:check && npm run typecheck
      - run: npm test
      - name: deploy
        id: deploy
        # The token is in scope for this step only; install scripts and tests never see it.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx wrangler deploy --env production | tee deploy.log
          version=$(sed -n 's/^Current Version ID: //p' deploy.log)
          [ -n "$version" ] || { echo "::error::wrangler printed no version id"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: smoke
        env:
          VERSION: ${{ steps.deploy.outputs.version }}
        run: |
          for attempt in $(seq 1 20); do
            live=$(curl -fsS https://api.ooooh.app/health | jq -r .version || true)
            [ "$live" = "$VERSION" ] && break
            echo "attempt $attempt: live $live, want $VERSION"
            sleep 3
          done
          [ "$live" = "$VERSION" ] || { echo "::error::$VERSION never answered on api.ooooh.app"; exit 1; }
          curl -fsS https://api.ooooh.app/v1/config | jq .version
