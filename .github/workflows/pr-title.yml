name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  merge_group:

jobs:
  conventional:
    runs-on: ubuntu-latest
    steps:
      - name: require conventional commit title
        # In the merge queue the squash subject is the PR title, carried as the first line of the group's head commit.
        env:
          TITLE: ${{ github.event.pull_request.title || github.event.merge_group.head_commit.message }}
        run: |
          echo "$TITLE" | head -1 | grep -qE '^(feat|fix|security|deps|chore|docs|test|refactor|perf|ci|build|style|revert)(\([a-z0-9._/-]+\))?!?: .' && exit 0
          echo "PR title must be a conventional commit: type(scope): subject"
          exit 1
