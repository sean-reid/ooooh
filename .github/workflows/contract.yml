name: contract

on:
  schedule:
    - cron: "17 6 * * *"
  pull_request:
    paths:
      - worker/src/jev/**
      - worker/src/anthropic.ts
      - worker/src/routes/speak.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: call each provider once
        # The keys are in scope for this step only, and a missing one fails here instead of skipping its test.
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          for name in TYPESAFE_API_KEY ANTHROPIC_API_KEY ELEVENLABS_API_KEY; do
            [ -n "${!name}" ] || { echo "::error::$name must be set in Actions secrets"; exit 1; }
          done
          npx vitest run --project node test/node/contract.test.ts
