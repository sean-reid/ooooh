<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ooooh share card</title>
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #0c0d11;
        overflow: hidden;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        display: flex;
        align-items: center;
        gap: 72px;
        padding: 0 120px;
        box-sizing: border-box;
        color: #ece9e2;
        font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
      }
      .orb {
        width: 360px;
        height: 360px;
        flex: none;
        border-radius: 50%;
        box-shadow: 0 0 120px 40px rgba(250, 189, 88, 0.22);
      }
      h1 {
        margin: 0 0 18px;
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
        font-weight: 400;
        font-size: 132px;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        font-size: 34px;
        line-height: 1.3;
        color: rgba(236, 233, 226, 0.78);
        max-width: 560px;
      }
      .url {
        position: absolute;
        right: 120px;
        bottom: 48px;
        font-size: 26px;
        color: #fabd58;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="orb" src="images/icon-512.png" alt="" />
      <div>
        <h1>ooooh</h1>
        <p>A voice-first thinking companion for people who think better by talking.</p>
      </div>
      <div class="url">ooooh.app</div>
    </div>
  </body>
</html>
