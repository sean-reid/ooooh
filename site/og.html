<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ooooh share card</title>
    <link rel="stylesheet" href="site.css" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        display: flex;
        align-items: center;
        gap: 48px;
        padding: 0 110px;
        box-sizing: border-box;
      }
      .card .orb {
        --side: 400px;
        flex: none;
      }
      .card h1 {
        margin: 0 0 18px;
        font-size: 132px;
        line-height: 1;
        letter-spacing: -0.02em;
      }
      .card p {
        margin: 0;
        font-size: 34px;
        line-height: 1.3;
        max-width: 560px;
      }
      .url {
        position: absolute;
        right: 110px;
        bottom: 48px;
        font-size: 26px;
      }
      .store {
        display: none;
      }
      .card .orb.still {
        animation: none;
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <canvas class="orb" aria-hidden="true"></canvas>
      <div>
        <h1>ooooh</h1>
        <p>A voice-first thinking companion for people who think better by talking.</p>
      </div>
      <a class="store" href="#"></a>
      <div class="url"><a href="https://ooooh.app/">ooooh.app</a></div>
    </div>
    <script type="module" src="landing.mjs"></script>
  </body>
</html>
