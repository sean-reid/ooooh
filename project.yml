name: ooooh
options:
  bundleIdPrefix: com.seanreid
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTED_INTERFACE_ORIENTATIONS: UIInterfaceOrientationPortrait
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: C6UWR42ZAP
packages:
  Packages:
    path: Packages
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: 1.19.7
targets:
  ooooh:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - path: App/Resources
        excludes: [Products.storekit]
      - path: fixtures/synthetic/estimate/decision.fixture.json
        buildPhase: resources
      - path: fixtures/demo/history.notes.json
        buildPhase: resources
    dependencies:
      - package: Packages
        product: Design
      - package: Packages
        product: State
      - package: Packages
        product: Governor
      - package: Packages
        product: Notes
      - package: Packages
        product: NotesUI
      - package: Packages
        product: Transcription
      - package: Packages
        product: Audio
      - package: Packages
        product: Proxy
      - package: Packages
        product: Billing
      - package: Packages
        product: Session
      - package: Packages
        product: Persistence
      - package: Packages
        product: Settings
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: ooooh
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [audio, remote-notification]
        NSMicrophoneUsageDescription: ooooh listens while you think aloud. Audio is transcribed on this phone.
        NSSpeechRecognitionUsageDescription: Speech is turned into text on this phone so your listener can follow along.
        ITSAppUsesNonExemptEncryption: false
        OoooohWorkerURL: $(OOOOH_WORKER_URL)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: A development build can talk to a Worker running on a Mac on your own network.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
    postBuildScripts:
      - name: Build number from git
        shell: /bin/sh
        basedOnDependencyAnalysis: false
        # Naming the processed plist as input runs the script after Xcode writes it and before signing.
        inputFiles: [$(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)]
        script: |
          count=$(git -C "$SRCROOT" rev-list --count HEAD 2>/dev/null) || count=$CURRENT_PROJECT_VERSION
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $count" "$TARGET_BUILD_DIR/$INFOPLIST_PATH"
    entitlements:
      path: App/Resources/ooooh.entitlements
      properties:
        com.apple.developer.devicecheck.appattest-environment: production
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.developer.icloud-container-identifiers: [iCloud.com.seanreid.ooooh]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seanreid.ooooh
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.4.0" # x-release-please-version
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
      configs:
        Debug:
          OOOOH_WORKER_URL: http://localhost:8787
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: decision.fixture.json history.notes.json
  oooohTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Tests
        excludes: [__Snapshots__]
      - path: Packages/Tests/SessionTests/Fixtures/short.json
        buildPhase: resources
      - path: Packages/Tests/ProxyTests/Fixtures/session-start-free.json
        buildPhase: resources
      - path: Packages/Tests/ProxyTests/Fixtures/session-start-paid.json
        buildPhase: resources
      - path: Packages/Tests/ProxyTests/Fixtures/session-start-refused.json
        buildPhase: resources
      - path: Packages/Tests/ProxyTests/Fixtures/entitlement-paid.json
        buildPhase: resources
      - path: Packages/Tests/ProxyTests/Fixtures/entitlement-free.json
        buildPhase: resources
      - path: Packages/Tests/ProxyTests/Fixtures/entitlement-refused.json
        buildPhase: resources
      - path: Packages/Tests/AudioTests/Fixtures/line.mp3
        buildPhase: resources
    dependencies:
      - target: ooooh
      - package: Packages
        product: TestSupport
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.seanreid.ooooh.tests
  BillingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/BillingTests
        excludes: [__Snapshots__]
      - path: App/Resources/Products.storekit
        buildPhase: resources
    dependencies:
      - target: ooooh
      - package: Packages
        product: TestSupport
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.seanreid.ooooh.billingtests
  oooohUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [App/UITests]
    dependencies:
      - target: ooooh
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.seanreid.ooooh.uitests
schemes:
  ooooh:
    build:
      targets:
        ooooh: all
        oooohTests: [test]
        oooohUITests: [test]
        BillingTests: [test]
    run:
      config: Debug
      storeKitConfiguration: App/Resources/Products.storekit
      commandLineArguments:
        "-worker-url https://api.ooooh.app": true
    test:
      config: Debug
      environmentVariables:
        OOOOH_SILENT_TESTS: "1"
      targets:
        - oooohTests
        - oooohUITests
        - BillingTests
        - package: Packages/DesignTests
        - package: Packages/NotesSnapshotTests
        - package: Packages/SettingsSnapshotTests
        - package: Packages/AudioTests
