name: ooooh
options:
  bundleIdPrefix: com.seanreid
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
    SUPPORTED_INTERFACE_ORIENTATIONS: UIInterfaceOrientationPortrait
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: C6UWR42ZAP
packages:
  Packages:
    path: Packages
targets:
  ooooh:
    type: application
    platform: iOS
    sources:
      - App/Sources
      - path: App/Resources
        excludes: [Products.storekit]
    dependencies:
      - package: Packages
        product: Design
      - package: Packages
        product: State
      - package: Packages
        product: Governor
      - package: Packages
        product: Notes
      - package: Packages
        product: Transcription
      - package: Packages
        product: Audio
      - package: Packages
        product: Proxy
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: ooooh
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: ooooh listens while you think aloud. Audio is transcribed on this phone.
        NSSpeechRecognitionUsageDescription: Speech is turned into text on this phone so your listener can follow along.
        ITSAppUsesNonExemptEncryption: false
        OoooohWorkerURL: $(OOOOH_WORKER_URL)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.seanreid.ooooh
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
      configs:
        Debug:
          OOOOH_WORKER_URL: http://localhost:8787
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: decision.fixture.json
  oooohTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/Tests
      - path: Packages/Tests/SessionTests/Fixtures/short.json
        buildPhase: resources
    dependencies:
      - target: ooooh
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.seanreid.ooooh.tests
  oooohUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [App/UITests]
    dependencies:
      - target: ooooh
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: com.seanreid.ooooh.uitests
schemes:
  ooooh:
    build:
      targets:
        ooooh: all
        oooohTests: [test]
        oooohUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: App/Resources/Products.storekit
    test:
      config: Debug
      targets:
        - oooohTests
        - oooohUITests
        - package: Packages/DesignTests
        - package: Packages/NotesSnapshotTests
        - package: Packages/AudioTests
