<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ooooh labeler</title>
    <link rel="stylesheet" href="labeler.css" />
  </head>
  <body>
    <header>
      <h1>ooooh labeler</h1>
      <p>
        Open a fixture and its recording, or drop both files here. Click an
        utterance or move with the arrow keys, then press the kind's key. Space
        plays and pauses the recording, Enter plays the current utterance, x
        clears its label. Export writes the labels file the eval reads.
      </p>
      <div class="controls">
        <label
          >Fixture <input id="fixture" type="file" accept="application/json"
        /></label>
        <label
          >Labels <input id="labels" type="file" accept="application/json"
        /></label>
        <label
          >Audio
          <input id="audio" type="file" accept=".caf,.m4a,.wav,.mp3,audio/*"
        /></label>
        <button id="export" disabled>Export labels</button>
        <span id="status"></span>
        <span id="clock"></span>
      </div>
    </header>
    <main>
      <div id="transcript"></div>
      <div id="playhead" hidden></div>
    </main>
    <script type="module" src="labeler.js"></script>
  </body>
</html>
