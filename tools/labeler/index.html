<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ooooh labeler</title>
    <link rel="stylesheet" href="labeler.css" />
  </head>
  <body>
    <header>
      <h1>ooooh labeler</h1>
      <p>
        Open a fixture, click an utterance where a prompt would have been
        welcome, pick the kind. Click again to clear. Export writes the labels
        file the eval reads.
      </p>
      <div class="controls">
        <label
          >Fixture <input id="fixture" type="file" accept="application/json"
        /></label>
        <label
          >Labels <input id="labels" type="file" accept="application/json"
        /></label>
        <button id="export" disabled>Export labels</button>
        <span id="status"></span>
      </div>
    </header>
    <main id="transcript"></main>
    <template id="kinds">
      <div class="kinds">
        <button data-kind="clarify">clarify</button>
        <button data-kind="deepen">deepen</button>
        <button data-kind="reflect">reflect</button>
        <button data-kind="decide">decide</button>
        <button data-kind="summarize">summarize</button>
        <button data-kind="challenge">challenge</button>
        <button data-kind="finished">finished</button>
        <button data-kind="leave">leave alone</button>
      </div>
    </template>
    <script type="module" src="labeler.js"></script>
  </body>
</html>
